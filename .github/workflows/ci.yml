name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # `@stable` used to carry the toolchain: that ref is a *branch* whose
          # own action.yml defaults the input to `stable`. Pinning the SHA
          # freezes that default too, so this is belt-and-braces — but it is
          # what keeps the job honest if the pin is ever moved.
          toolchain: stable
          components: rustfmt, clippy
      # stylo's build.rs runs a mako code generator (needs python3 on PATH).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      # `parley/system` (on by default via `layout`'s `system_fonts`) links
      # fontconfig on Linux, and the runner image ships no `fontconfig.pc`.
      - name: Fontconfig headers
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The optional decoders are off by default, so nothing else in CI compiles
      # them — including the untrusted-SVG parse options.
      - name: clippy (optional paint features)
        run: cargo clippy -p oxidepage-paint --all-targets --features svg,webp -- -D warnings
      - name: WebIDL codegen freshness
        run: cargo xtask codegen --check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      # stylo's build.rs runs a mako code generator (needs python3 on PATH).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      # See the lint job: the system font source needs fontconfig on Linux.
      - name: Fontconfig headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      # Guards the SVG/WebP decode paths (local-file href refusal, size caps),
      # which the default feature set never builds.
      - name: Test (optional paint features)
        run: cargo test -p oxidepage-paint --features svg,webp
      - name: Display-list goldens
        run: cargo xtask golden
      - name: Reftests
        run: cargo xtask reftest

  wpt:
    name: Web Platform Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      # stylo's build.rs runs a mako code generator (needs python3 on PATH).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      # See the lint job: the system font source needs fontconfig on Linux.
      - name: Fontconfig headers
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Release build: each test runs in its own subprocess (via current_exe),
      # so a release xtask runs the JS/style engine at full speed, and the
      # runner fans the subprocesses out across all cores.
      - name: Run WPT subsets against expectations
        run: cargo run --release -p xtask -- wpt

  puppeteer:
    name: Puppeteer conformance
    # Ubuntu only, like the WPT job: the runner drives one endpoint with a real
    # driver, and a second platform would triple the time for no extra signal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/automation/package.json
      # See the lint job: the system font source needs fontconfig on Linux.
      - name: Fontconfig headers
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Release for the same reason the WPT job is: this drives the whole engine
      # through a real driver, and a debug build turns minutes into tens of them.
      # Fixtures are served from loopback; CI never touches the internet.
      - name: Puppeteer
        run: cargo run --release -p xtask -- puppeteer

  playwright:
    name: Playwright conformance
    # Ubuntu only, for the same reason the Puppeteer job is: one endpoint driven
    # by a real driver, and a second platform would cost time for no signal.
    #
    # A **job of its own**, deliberately not a second step of the Puppeteer job
    # and not chained after WPT. The runner's `context.newPage` budget is 60 s
    # and the whole suite fails as one when it is missed, so sharing a machine
    # with WPT's 10-way-parallel sweep is how this turns flaky
    # (docs/automation-roadmap.md records that history).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/playwright/package.json
      # See the lint job: the system font source needs fontconfig on Linux.
      - name: Fontconfig headers
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Release for the same reason the Puppeteer job is: this drives the whole
      # engine through a real driver, and a debug build turns minutes into tens
      # of them. Fixtures are served from loopback; CI never touches the
      # internet.
      - name: Playwright
        run: cargo run --release -p xtask -- playwright

  audit:
    name: Advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      # No project build here: `cargo audit` reads `Cargo.lock`, so this job
      # needs neither python3 nor fontconfig and finishes in seconds.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Fails on any RustSec advisory affecting the locked dependency graph.
      # A finding is fixed by bumping the lockfile, not by adding an ignore:
      # this gate exists because a transitive DoS in the HTTP stack is a bug in
      # the fetch pipeline whoever wrote it.
      - name: cargo audit
        run: cargo audit

  msrv:
    name: MSRV (1.89.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # `rust-version` in the workspace manifest is a promise; without a job
          # that keeps it, it is a comment. Bumping it is a deliberate edit in
          # two places, which is the point.
          toolchain: 1.89.0
      # stylo's build.rs runs a mako code generator (needs python3 on PATH).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      # See the lint job: the system font source needs fontconfig on Linux.
      - name: Fontconfig headers
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `check`, not `test`: this job answers "does the declared MSRV compile
      # the workspace", and the behavior itself is covered on stable across
      # three platforms. `--all-targets` so tests and benches are checked too.
      - name: cargo check
        run: cargo check --workspace --all-targets
