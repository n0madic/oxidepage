<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="match" href="iframe-basic-ref.html"></head>
<!--
  A frame's content is spliced into its embedder's display list, clipped to the
  `<iframe>` content box and translated to its origin (ADR-0035 D7). The green
  band is taller than the frame, so the clip is load-bearing: without it the
  splice would paint past the bottom edge.

  Ahem backs every family in this runner, so the text is exact 20px squares.
-->
<body style="margin:0;background:#ffffff">
  <div style="width:200px;height:20px;background:#0000ff"></div>
  <iframe width="200" height="60" style="display:block;border:0"
    srcdoc="<body style='margin:0;background:#ffffff'>
      <div style='width:200px;height:100px;background:#00ff00'></div>"></iframe>
  <div style="width:200px;height:20px;background:#0000ff"></div>
</body></html>
