<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="match" href="inline-svg-ref.html"></head>
<body style="margin:0">
  <!-- An inline <svg> is a replaced element: it takes its intrinsic size from
       the markup and rasterizes to the same pixels as the equivalent <img>. -->
  <svg xmlns="http://www.w3.org/2000/svg" width="120" height="60" viewBox="0 0 120 60">
    <rect x="0" y="0" width="120" height="60" fill="#0000ff"/>
    <circle cx="30" cy="30" r="20" fill="#ff0000"/>
  </svg>
</body></html>
