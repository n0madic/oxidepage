<!DOCTYPE html>
<html>
<body style="margin:0">
  <div style="position:relative;width:300px;height:200px">
    <div style="position:absolute;left:0;top:0;width:100px;height:100px;z-index:-1;background:#ff0000"></div>
    <div style="width:200px;height:150px;background:#00ff00"></div>
    <div style="position:absolute;left:50px;top:50px;width:100px;height:100px;z-index:1;background:#0000ff"></div>
    <div style="position:absolute;left:80px;top:80px;width:60px;height:60px;background:#ffff00"></div>
  </div>
</body>
</html>
