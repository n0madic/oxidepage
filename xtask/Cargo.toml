[package]
name = "xtask"
description = "Workspace automation: codegen driver, test-suite vendoring, WPT/reftest runners"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
oxidepage-idl = { workspace = true }
oxidepage-page = { workspace = true }
oxidepage-raster-skia = { workspace = true }
oxidepage-js = { workspace = true }
# The WPT `url/` runner serves vendored files over loopback so those tests
# load and run over the real network stack.
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros"] }

[lints]
workspace = true
